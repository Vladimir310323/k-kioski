<style>:root{
  --bg:#161616;
  --panel:#1d1d1d;
  --deep:#0e0e0e;
  --amber:#F5A623;
  --amber-mid:#E8A33D;
  --amber-dim:#8A5E1A;
  --ink:#F2EDE3;
  --dim:#8f8f8f;
  --red:#C0392B;
  --u:8px;
}*{margin:0;padding:0;box-sizing:border-box;border-radius:0 !important;}html,body{background:var(--bg);color:var(--ink);font-family:'VT323','JetBrains Mono',monospace;font-size:22px;
  min-height:100vh;overflow-x:hidden;}html{scroll-padding-bottom:150px;}/* keeps content clear of fixed bottom nav / cart bar when browser scrolls an element into view */
.hidden{display:none !important;}button{font-family:inherit;}::selection{background:var(--amber);color:var(--bg);}/* vapor canvas */

  box-shadow:6px 6px 0 0 #000;}/* ---- HEADER ---- */
.hdr{padding:calc(var(--u)*5) calc(var(--u)*2) calc(var(--u)*5);text-align:center;}.sign{display:inline-block;position:relative;padding:calc(var(--u)*2) calc(var(--u)*4);
  border:4px solid var(--amber);background:var(--deep);box-shadow:8px 8px 0 0 #000;
  cursor:pointer;user-select:none;-webkit-user-select:none;}.sign .nm{font-family:'Press Start 2P',monospace;font-size:24px;letter-spacing:2px;line-height:1;}.sign .nm .k{color:var(--amber);}.sign.glow{box-shadow:8px 8px 0 0 #000, 0 0 22px rgba(245,166,35,.55);border-color:#ffc55e;}.reviews-row .btn.glow{box-shadow:4px 4px 0 0 #000, 0 0 18px rgba(245,166,35,.5);border-color:#ffc55e;color:#ffc55e;}.reviews-row{max-width:600px;margin:calc(var(--u)*3) auto calc(var(--u)*5);padding:0 calc(var(--u)*3);}.reviews-row .btn{display:block;text-align:center;text-decoration:none;
  font-size:15px;padding:16px;letter-spacing:2px;}/* ---- LIST ---- */
.list{max-width:600px;margin:0 auto;padding:0 calc(var(--u)*3) 0;
  display:flex;flex-direction:column;gap:calc(var(--u)*5);}.item{cursor:pointer;position:relative;padding:calc(var(--u)*1.5);}.item.off{cursor:default;}.shot{position:relative;width:100%;aspect-ratio:1/1;background:var(--deep);
  border:3px solid #2c2c2c;overflow:hidden;}.shot img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto;}.item.off .shot img{filter:grayscale(1) brightness(.5);}.shot .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#333;font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:2px;}.tag{position:absolute;top:-3px;left:-3px;font-family:'Press Start 2P',monospace;font-size:9px;
  padding:8px 11px;letter-spacing:1px;border:3px solid var(--ink);}.tag.new{background:var(--amber);color:var(--bg);}.tag.sale{background:var(--red);color:var(--ink);animation:pulse 1.6s steps(2,end) infinite;}
@keyframes pulse{50%{opacity:.35}}/* highlight the photo frame of tagged items so they stand out while scrolling */
.item.has-new .shot{border-color:var(--amber-dim);animation:tagGlowNew 2.6s steps(4,end) infinite;}.item.has-sale .shot{border-color:#7a2a22;animation:tagGlowSale 2s steps(4,end) infinite;}
@keyframes tagGlowNew{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 2px rgba(245,166,35,.22)}}
@keyframes tagGlowSale{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 2px rgba(192,57,43,.28)}}.sold{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(14,14,14,.78);}.sold b{font-family:'Press Start 2P',monospace;font-size:12px;border:3px solid var(--ink);
  padding:11px 15px;letter-spacing:1px;background:var(--deep);}.meta{margin-top:calc(var(--u)*2);}.ttl{font-size:25px;line-height:1.15;letter-spacing:.5px;white-space:nowrap;overflow:hidden;flex:1;min-width:0;}.ttl.wrap-mode{white-space:pre-line;}.note{color:var(--dim);font-size:17px;line-height:1.35;margin-top:9px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.note.wrap-mode{white-space:pre-line;text-overflow:clip;}/* tier row — always one line, shrinks to fit */
.tierline{margin-top:calc(var(--u)*1.5);display:flex;gap:5px;white-space:nowrap;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;}.tierline::-webkit-scrollbar{display:none;}.tierline .tc{font-size:22px;color:var(--amber-mid);border:2px solid var(--amber-dim);
  padding:4px 8px;letter-spacing:0;flex-shrink:0;}.tierline .tc.act{background:var(--amber);color:#000;border-color:var(--amber);}.tierline .tc.blink{animation:tcblink .5s steps(1,end);}

@keyframes flashOk{0%,100%{background:transparent}50%{background:rgba(245,166,35,.18)}}

@keyframes numBump{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.stp button:disabled{opacity:.2;cursor:not-allowed;border-color:#3a3a3a;color:#3a3a3a;}.stp .n{font-family:'Press Start 2P',monospace;font-size:18px;min-width:30px;text-align:center;

@keyframes lowpulse{0%,100%{opacity:1}50%{opacity:.25}}/* ---- CART BAR ---- */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--deep);

function toB64(s){ return btoa(unescape(encodeURIComponent(s))); }
async function publish(){
  const cfg=adminCfg();
  while(pubBusy) await new Promise(r=>setTimeout(r,300));  
  const core=pubCore();
  const body=JSON.stringify({...JSON.parse(core), updated:new Date().toISOString()},null,1);
  if(cfg.repo && cfg.token){
    if(core===lastPubCore) return "same";
    pubBusy=true;
    try{
    const url="https://api.github.com/repos/"+cfg.repo+"/contents/catalog.json";
    const H={"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json"};
    let sha;
    const g=await fetch(url,{headers:H});
    if(g.ok) sha=(await g.json()).sha; else if(g.status!==404) throw new Error("GitHub "+g.status);
    const p=await fetch(url,{method:"PUT",headers:H,body:JSON.stringify({message:"catalog update",content:toB64(body),sha})});
    if(!p.ok) throw new Error("GitHub "+p.status);
    lastPubCore=core;
    try{ localStorage.setItem("kk_lastpub", core); }catch(e){}
    return "github";
    } finally { pubBusy=false; }
  }
  throw new Error("no repo/token (⚙)");
}

function transitionFlash(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(window._tpx) return; window._tpx=true;
  const W=innerWidth,H=innerHeight,cs=Math.ceil(W/9),cols=9,rows=Math.ceil(H/cs);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  cv.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;z-index:500;pointer-events:none;image-rendering:pixelated";
  document.body.appendChild(cv); const cx=cv.getContext("2d");
  const cells=[]; for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)cells.push([x,y]);
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]];}
  const steps=6, per=Math.ceil(cells.length/steps); let k=0, phase=0;
  const tick=()=>{
    if(phase===0){ cx.fillStyle="#000"; cells.slice(k*per,(k+1)*per).forEach(c=>cx.fillRect(c[0]*cs,c[1]*cs,cs,cs)); k++; if(k>=steps){phase=1;k=0;} }
    else { cells.slice(k*per,(k+1)*per).forEach(c=>cx.clearRect(c[0]*cs,c[1]*cs,cs,cs)); k++; if(k>=steps){ cv.remove(); window._tpx=false; return; } }
    setTimeout(tick,28);
  }; tick();
}

let actx=null;
function ac(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq,dur,vol,type,delay){
  try{
    const a=ac(); if(a.state==="suspended") a.resume();
    const t0=a.currentTime+(delay||0);
    const osc=a.createOscillator(), gain=a.createGain();
    osc.type=type||"square"; osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(vol||0.06,t0+0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(gain); gain.connect(a.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}

function pixBox(level,closed,pop){
  const R=(x,y,w,h,c,cls)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"'+(cls?' class="'+cls+'"':'')+'/>';
  const o="#f5a623",A="#c27d0e",B="#ffc55e",C="#8a5a0a";
  let g="";
  if(!closed){
    const n=Math.max(0,level), cyc=n===0?0:((n-1)%20)+1, order=[2,0,4,1,3], cols=[4,7,10,13,16], pal=[A,B,C,B,A];
    for(let u=0;u<cyc;u++){
      const ci=order[u%5], row=Math.floor(u/5), isNew=(u===cyc-1);
      g+=R(cols[ci],8-row*2-1,3,2,pal[ci],(pop&&isNew)?"itm drop":"itm");
    }
    if(n>0&&cyc===20) g+=R(0,0,1,1,B,"itm")+R(23,0,1,1,B,"itm")+R(11,0,2,1,B,"itm");
    g+=R(2,8,1,1,o)+R(1,7,1,1,o)+R(0,6,1,1,o)+R(3,9,1,1,o);
    g+=R(21,8,1,1,o)+R(22,7,1,1,o)+R(23,6,1,1,o)+R(20,9,1,1,o);
    g+=R(3,9,18,2,o)+R(3,11,2,8,o)+R(19,11,2,8,o)+R(3,17,18,2,o)+R(10,13,4,3,o);
  } else {
    g+=R(2,5,20,2,o)+R(2,7,2,3,o)+R(20,7,2,3,o)+R(3,9,18,2,o)+R(3,11,2,7,o)+R(19,11,2,7,o)+R(3,17,18,2,o);
    g+=R(10,5,4,6,B)+R(10,11,4,4,B)+R(6,13,3,3,C);
  }
  return '<svg class="pbox'+(pop?' bump':'')+((pop&&level>0&&level%20===0)?' full':'')+'" viewBox="0 -2 24 22" width="30" height="30" shape-rendering="crispEdges" style="overflow:hidden">'+g+'</svg>';
}

// ================= vapor background =================


function startVapor(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("vapor"),x=c.getContext("2d");
  let w,h,puffs=[];
  const P=8; // pixel block size — keeps it 8-bit
  function size(){ w=c.width=Math.floor(innerWidth/P); h=c.height=Math.floor(innerHeight/P);
    c.style.width=innerWidth+"px"; c.style.height=innerHeight+"px";
    x.imageSmoothingEnabled=false; }
  size(); addEventListener("resize",size);
  function spawn(){ puffs.push({x:Math.random()*w,y:h+2,r:1.4+Math.random()*2,
    v:.06+Math.random()*.08,a:.24+Math.random()*.16,drift:(Math.random()-.5)*.05}); }
  for(let i=0;i<11;i++){ spawn(); puffs[i].y=Math.random()*h; }

  window._vaporBurst=function(px,py){
    // px,py in CSS pixels (e.g. from a click event) — convert to grid space
    const gx=px/P, gy=py/P;
    for(let i=0;i<7;i++){
      puffs.push({x:gx+(Math.random()-0.5)*4, y:gy, r:1.5+Math.random()*2.2,
        v:.10+Math.random()*.10, a:.5+Math.random()*.2, drift:(Math.random()-.5)*.12});
    }
  };

  (function loop(){
    // pause work when a modal covers the background or the tab is hidden
    const modalOpen=!!document.querySelector(".sheet:not(.hidden)");
    if(document.hidden || modalOpen){ requestAnimationFrame(loop); return; }
    x.clearRect(0,0,w,h);
    puffs.forEach(p=>{
      p.y-=p.v; p.x+=p.drift; p.a-=0.00035; p.r+=0.0025;
      if(p.a>0){ x.fillStyle="rgba(245,166,35,"+p.a.toFixed(3)+")";
        x.fillRect(Math.round(p.x-p.r),Math.round(p.y-p.r),Math.round(p.r*2),Math.round(p.r*2)); }
    });
    puffs=puffs.filter(p=>p.a>0&&p.y>-6);
    if(puffs.length<12 && Math.random()<0.035) spawn();
    requestAnimationFrame(loop);
  })();
}

// photo: re-encode in canvas (drops EXIF/GPS/all metadata), shrink, upload to repo img/
async function uploadPhoto(file){
  const cfg=adminCfg();
  if(!cfg.repo||!cfg.token) throw new Error("no repo/token (⚙)");
  const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
  const k=Math.min(1,900/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(bmp.width*k)); c.height=Math.max(1,Math.round(bmp.height*k));
  const x=c.getContext("2d"); x.fillStyle="#000"; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  if(!blob) throw new Error("image");
  const u8=new Uint8Array(await blob.arrayBuffer()); let bin="";
  for(let i=0;i<u8.length;i+=8192) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
  const name="img/"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+".jpg";
  const r=await fetch("https://api.github.com/repos/"+cfg.repo+"/contents/"+name,{method:"PUT",
    headers:{"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json"},
    body:JSON.stringify({message:"photo",content:btoa(bin)})});
  if(!r.ok) throw new Error("GitHub "+r.status);
  return name;
}

  Object.keys(CLOSERS).forEach(sheetId=>{
    const sheet=document.getElementById(sheetId); if(!sheet) return;
    const pane=sheet.querySelector(".pane"); if(!pane) return;
    let startY=null, dragging=false;
    pane.addEventListener("touchstart",e=>{
      if(pane.scrollTop>0) return; // only when already at the top of the pane
      startY=e.touches[0].clientY; dragging=true;
    },{passive:true});
    pane.addEventListener("touchmove",e=>{
      if(!dragging || startY===null) return;
      const dy=e.touches[0].clientY-startY;
      if(dy>0) pane.style.transform="translateY("+Math.min(dy,120)+"px)";
    },{passive:true});
    pane.addEventListener("touchend",e=>{
      if(!dragging) return;
      const dy=(e.changedTouches[0].clientY)-startY;
      pane.style.transform="";
      dragging=false; startY=null;
      if(dy>90){ CLOSERS[sheetId](); }
    });
  });
})();

function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }

function findVariant(pid, vname){
  const p=PRODUCTS.find(x=>x.id===pid);
  if(!p) return null;
  if(!hasV(p)) return {product:p, variant:null};
  if(vname==null) return null;
  const v=(p.variants||[]).find(x=>x.name===vname);
  if(!v) return null;
  return {product:p, variant:v};
}
function getStock(f){ return f.variant ? (+f.variant.stock||0) : (+f.product.stock||0); }
function setStock(f,val){ if(f.variant) f.variant.stock=val; else f.product.stock=val; }
function repriceProduct(p){
  const tot=R.items.reduce((s,l)=>s+(l.pid===p.id?l.qty:0),0);
  R.items.forEach(l=>{ if(l.pid===p.id) l.unit_price=priceAt(p,tot); });
}

  box.querySelectorAll("[data-vqty]").forEach(el=>el.onclick=()=>openKassaQtyPad(p, el.dataset.vqty||null));
  bindKassaStepperHold(p);

function bindKassaStepperHold(p){
  document.querySelectorAll("#checkoutBody .stp button[data-vinc], #checkoutBody .stp button[data-vdec]").forEach(b=>{
    const isInc=b.hasAttribute("data-vinc");
    const vname=(isInc?b.dataset.vinc:b.dataset.vdec)||null;
    let holdTimer=null, repeatTimer=null;
    function startHold(){
      holdTimer=setTimeout(()=>{
        let delay=260;
        const tick=()=>{
          const line=R.items.find(l=>l.pid===p.id && l.vname===(vname||null));
          const v=vname?p.variants.find(x=>x.name===vname):{stock:p.stock};
          const stock=+(v&&v.stock)||0;
          const canGo=isInc ? ((line?line.qty:0)<stock) : (line && line.qty>0);
          if(!canGo){ stopHold(); return; }
          stepVariantQty(p, vname, isInc?1:-1);
          delay=Math.max(60, delay-35);
          repeatTimer=setTimeout(tick, delay);
        };
        tick();
      }, 450);
    }
    function stopHold(){
      clearTimeout(holdTimer); clearTimeout(repeatTimer);
      holdTimer=repeatTimer=null;
      if(activeHoldStop===stopHold) activeHoldStop=null;
    }
    b.addEventListener("pointerdown", ()=>{ activeHoldStop=stopHold; startHold(); });
    b.addEventListener("pointerleave", stopHold);
  });
}
function stepVariantQty(p, vname, dir){
  const v=vname ? p.variants.find(x=>x.name===vname) : {name:null, stock:p.stock};
  const stock=+v.stock||0;
  let line=R.items.find(l=>l.pid===p.id && l.vname===(vname||null));
  if(dir>0){
    if(!line){ line={pid:p.id, vname:vname||null, product_name:pname(p), variant_name:vname||"", qty:0, unit_price:0}; R.items.push(line); }
    if(line.qty<stock){ line.qty++; }
  } else if(line){
    line.qty--;
    if(line.qty<=0) R.items=R.items.filter(l=>l!==line);
  }
  repriceProduct(p);
  R.customTotal=null;
  renderVariantStep();
}
function openKassaQtyPad(p, vname){
  const v=vname ? p.variants.find(x=>x.name===vname) : {name:null, stock:p.stock};
  const stock=+v.stock||0;
  const line=R.items.find(l=>l.pid===p.id && l.vname===(vname||null));
  qtyPadMode="kassa";
  qtyPadCtx={pid:p.id, vname, max:stock, val:String(line?line.qty:0)};
  document.getElementById("qtyPadMax").textContent=stock;
  refreshQtyPad();
  document.getElementById("qtyPadSheet").classList.remove("hidden");
}
function kassaSetQty(pid, vname, v){
  const p=PRODUCTS.find(x=>x.id===pid);
  if(!p) return;
  let line=R.items.find(l=>l.pid===pid && l.vname===(vname||null));
  if(v<=0){ if(line) R.items=R.items.filter(l=>l!==line); }
  else{
    if(!line){ line={pid, vname:vname||null, product_name:pname(p), variant_name:vname||"", qty:0, unit_price:0}; R.items.push(line); }
    line.qty=v;
  }
  repriceProduct(p);
  R.customTotal=null;
  renderVariantStep();
}

function confirmReceipt(){
  if(!R.items.length) return Promise.resolve();
  return (async()=>{
  const oldSale = editingSaleId ? SALES.find(x=>x.id===editingSaleId) : null;
  try{
    if(oldSale){
      oldSale.items.forEach(it=>{
        const f=findVariant(it.pid,it.vname);
        if(f) setStock(f, getStock(f)+it.qty);
      });
    }
    for(const l of R.items){
      const f=findVariant(l.pid,l.vname);
      if(!f) throw {error:"bad_item"};
      if(getStock(f)<l.qty) throw {error:"insufficient_stock"};
    }
    const total=R.kind==="gift" ? 0 : (R.customTotal!=null ? (parseFloat(R.customTotal)||0) : receiptComputedTotal());
    const lines=R.items.map(l=>{
      const f=findVariant(l.pid,l.vname);
      setStock(f, getStock(f)-l.qty);
      return {pid:l.pid, vname:l.vname, product_name:l.product_name, variant_name:l.variant_name, qty:l.qty, unit_price:l.unit_price};
    });
    const isGift=R.kind==="gift";
    if(oldSale){
      oldSale.total_amount=round2(total);
      oldSale.kind=R.kind;
      oldSale.items=lines; oldSale.note=R.note||"";
      oldSale.paid=isGift; oldSale.paid_amount=isGift?round2(total):0;
    } else {
      SALES.push({
        id:"s"+Date.now()+Math.random().toString(36).slice(2,6), date:R.date||new Date().toISOString().slice(0,10),
        total_amount:round2(total), kind:R.kind,
        paid:isGift, paid_amount:isGift?round2(total):0,
        note:R.note||"", created_at:new Date().toISOString(), items:lines
      });
    }
    editingSaleId=null;
    document.getElementById("checkoutSheet").classList.add("hidden");
    save(); draw(); loadSales(); flash();
  }catch(e){
    if(oldSale){
      oldSale.items.forEach(it=>{
        const f=findVariant(it.pid,it.vname);
        if(f) setStock(f, Math.max(0, getStock(f)-it.qty));
      });
    }
    await customAlert(e && e.error==="insufficient_stock" ? "Not enough stock" : "Failed");
    renderMainReceiptStep();
  }
  })();
}

function fmtDateHeader(d){

  if(d===today) return "Today";
  if(d===yesterday) return "Yesterday";
  const parts=d.split("-");
  return parts[2]+"."+parts[1]+"."+parts[0];
}

function loadPurchases(){
  const box=document.getElementById("purchasesList"); box.innerHTML="";

  if(!list.length){ box.innerHTML='<div class="kempty">—</div>'; return; }
  list.forEach(p=>{
    const pending=!!p.ordered;
    const d=document.createElement("div"); d.className="purch"+(pending?" pending":"");
    d.innerHTML=
      '<div class="purch-top"><span class="purch-name">'+esc(p.product_name)+'</span>'+
        '<span class="purch-sum">'+p.items.reduce((t,i)=>t+i.qty,0)+' pcs</span></div>'+
      p.items.filter(i=>i.vname).map(i=>'<div class="stockrow"><span class="stockname">'+esc(i.vname)+'</span><span class="stockqty">'+i.qty+'</span></div>').join("")+
      '<div class="purch-meta">'+esc(p.date)+(p.note?' · '+esc(p.note):'')+'</div>'+
      (pending?'<div class="purch-badges"><span class="pbadge wait">on way</span></div>':'')+
      (pending?'<div class="purch-acts">'+
        '<button class="btn sm" data-recv="'+p.id+'">ARRIVED</button>'+
        '<button class="btn mute sm" data-pdel="'+p.id+'">✕ DELETE</button>'+
      '</div>':'');
    box.appendChild(d);
  });
  box.querySelectorAll("[data-recv]").forEach(b=>b.onclick=async()=>{
    if(!(await customConfirm("Arrived? Stock will be added."))) return;
    const p=PURCHASES.find(x=>x.id===b.dataset.recv);
    const fs=p.items.map(i=>findVariant(p.pid,i.vname||null));
    if(fs.some(f=>!f)){ await customAlert("Not found"); return; }
    p.items.forEach((i,k)=>setStock(fs[k], getStock(fs[k])+i.qty));
    PURCHASES=PURCHASES.filter(x=>x.id!==p.id);
    save(); draw(); loadPurchases(); renderStockOverview(); flash();
  });
  box.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=async()=>{
    if(!(await customConfirm("Delete batch?"))) return;
    PURCHASES=PURCHASES.filter(x=>x.id!==b.dataset.pdel);
    save(); loadPurchases(); flash();
  });

    }).join(""):"";
    return '<div class="stockcard">'+
      '<div class="stockcard-head"><span>'+esc(pname(p)||"(no name)")+'</span><span style="color:'+totalColor+'">'+totalStock+' pcs</span></div>'+
      rows+
    '</div>';
  }).join("");
}

document.getElementById("addPurchaseBtn").onclick=()=>{
  const sel=document.getElementById("pchProduct");
  sel.innerHTML=PRODUCTS.map(p=>'<option value="'+p.id+'">'+esc(pname(p)||"(no name)")+'</option>').join("");
  document.getElementById("pchNote").value="";
  pchOrdered=0;
  document.querySelectorAll("#pchOrderedPick button").forEach(b=>b.classList.toggle("on",b.dataset.ord==="0"));
  sel.onchange=renderPchVariantQtys;
  renderPchVariantQtys();
  document.getElementById("purchaseSheet").classList.remove("hidden");
};
function renderPchVariantQtys(){
  const pid=document.getElementById("pchProduct").value;
  const p=PRODUCTS.find(x=>x.id===pid);
  const box=document.getElementById("pchVariantQtys");
  if(!p){ box.innerHTML=""; return; }
  if(hasV(p)){
    box.innerHTML=p.variants.map((v,vi)=>
      '<label class="f" style="margin-bottom:8px">'+esc(v.name)+' <span style="color:var(--dim)">(now '+(+v.stock||0)+' pcs)</span>'+
      '<input type="number" min="0" placeholder="0" data-pchqty="'+vi+'"></label>'
    ).join("");
  } else {
    box.innerHTML='<label class="f">Qty <span style="color:var(--dim)">(now '+(+p.stock||0)+' pcs)</span>'+
      '<input type="number" min="0" placeholder="0" data-pchqty="-1"></label>';
  }
}
document.getElementById("purchaseClose").onclick=()=>document.getElementById("purchaseSheet").classList.add("hidden");
let pchOrdered=0;
document.querySelectorAll("#pchOrderedPick button").forEach(b=>b.onclick=()=>{
  pchOrdered=+b.dataset.ord;
  document.querySelectorAll("#pchOrderedPick button").forEach(x=>x.classList.toggle("on",x===b));
});
document.getElementById("confirmPurchaseBtn").onclick=async()=>{
  const pid=document.getElementById("pchProduct").value;
  const p=PRODUCTS.find(x=>x.id===pid);
  if(!p){ await customAlert("No items — add one first"); return; }
  const note=document.getElementById("pchNote").value.trim();
  const now=new Date();
  const items=[];
  document.querySelectorAll("[data-pchqty]").forEach(inp=>{
    const qty=parseInt(inp.value)||0;
    if(qty<=0) return;
    const vi=+inp.dataset.pchqty;
    const vname=vi>=0 ? p.variants[vi].name : null;
    if(!findVariant(p.id, vname)) return;
    items.push({vname,qty});
  });
  const added=items.length;
  if(added){
    if(pchOrdered){
      PURCHASES.push({id:"pu"+Date.now()+Math.random().toString(36).slice(2,6), pid:p.id,
        product_name:pname(p), items, date:now.toISOString().slice(0,10),
        ordered:true, received_date:null, note, created_at:now.toISOString()});
    } else items.forEach(i=>{ const f=findVariant(p.id,i.vname); setStock(f,getStock(f)+i.qty); });
  }
  if(!added){ await customAlert("Enter qty"); return; }
  document.getElementById("purchaseSheet").classList.add("hidden");
  save(); draw(); loadPurchases(); renderStockOverview(); flash();
};

boot();
</script>
</body>
</html>
